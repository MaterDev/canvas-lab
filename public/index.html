<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05080c">
<title>Canvas Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%2305080c%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%274%27 fill=%27none%27 stroke=%27%235ee0ff%27 stroke-width=%271.5%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- full-viewport stage; the active piece renders here -->
<div id="stage"></div>
<div id="empty">Select a piece from the menu ↙</div>

<!-- bottom-left launchers: open upward, then expand across (clear of the viewer shell) -->
<button id="navToggle" class="fab" title="Gallery" aria-label="Gallery"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26,2H8A2,2,0,0,0,6,4V8H4v2H6v5H4v2H6v5H4v2H6v4a2,2,0,0,0,2,2H26a2,2,0,0,0,2-2V4A2,2,0,0,0,26,2Zm0,26H8V24h2V22H8V17h2V15H8V10h2V8H8V4H26Z"/><path d="M14 8H22V10H14z"/><path d="M14 15H22V17H14z"/><path d="M14 22H22V24H14z"/></svg></button>
<button id="notesToggle" class="fab hidden" title="Notes" aria-label="Notes"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M25.7,9.3l-7-7C18.5,2.1,18.3,2,18,2H8C6.9,2,6,2.9,6,4v24c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V10C26,9.7,25.9,9.5,25.7,9.3z M18,4.4l5.6,5.6H18V4.4z M24,28H8V4h8v6c0,1.1,0.9,2,2,2h6V28z"/><path d="M10 22H22V24H10z"/><path d="M10 16H22V18H10z"/></svg></button>

<section id="nav" class="panel hidden" aria-label="Gallery">
  <header><span class="brand">CANVAS&nbsp;LAB</span><span id="count" class="count"></span></header>
  <input id="search" type="search" placeholder="search title, tag, type…" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div id="filters"></div>
  <ul id="list"></ul>
</section>

<section id="notes" class="panel hidden" aria-label="Notes">
  <header><span id="notesTitle" class="brand">NOTES</span><span id="notesState" class="count"></span></header>
  <div id="meta" class="meta"></div>
  <textarea id="notesText" placeholder="Notes for this piece (markdown). Saved to notes.md."></textarea>
  <div class="row"><button id="notesSave" class="btn">Save notes</button></div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
